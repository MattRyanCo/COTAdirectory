# COTA Family Directory - nginx security rules
#
# nginx ignores .htaccess files, so these rules do the same job as the ones
# in the app's .htaccess (which only apply to Apache, e.g. local Laragon).
#
# One-time server setup (as root):
#   1. Copy this file to the server:
#        cp /root/www/cotadirectory/deploy/nginx/cotadirectory-security.conf /etc/nginx/snippets/
#   2. In the site's server { } block (e.g. /etc/nginx/sites-available/<site>), add
#        include snippets/cotadirectory-security.conf;
#      ABOVE the "location ~ \.php$" block. nginx uses the first matching
#      regex location, so these rules must come before the PHP one.
#   3. Test and reload:
#        nginx -t && systemctl reload nginx
#
# Every rule answers 403 Forbidden.

# Never list folder contents.
autoindex off;

# Database dumps (server administrator only), generated directory booklets
# (served by app-includes/download.php after sign-in), and third-party code.
# "^~" stops nginx checking regex locations, so even .php files in these
# folders are refused.
location ^~ /backups/   { deny all; }
location ^~ /downloads/ { deny all; }
location ^~ /vendor/    { deny all; }
location ^~ /deploy/    { deny all; }

# Hidden files and folders (.env holds the database password; .git, .github, ...),
# except .well-known, which certificate renewal (e.g. Let's Encrypt) needs.
location ~ /\.(?!well-known(/|$)) { deny all; }

# Logs, SQL dumps, CSV files (older versions of Import left uploaded member data
# in app-includes/uploads/), docs and config files anywhere on the site.
location ~* \.(log|sql|csv|md|yml|yaml|xml|lock|conf)$ { deny all; }
location ~* (^|/)composer\.json$ { deny all; }

# Removed in 4.2.0; refused in case an old copy is still on the server.
location = /phpinfo.php { deny all; }
