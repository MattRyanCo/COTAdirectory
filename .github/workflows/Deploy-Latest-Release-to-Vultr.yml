name: Deploy Latest Release to Vultr

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to deploy'
        required: true
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download latest release archive
        run: |
          curl -L "https://github.com/MattRyanCo/COTAdirectory/archive/refs/tags/${{ steps.tag.outputs.tag }}.zip" -o cotadirectory.zip
          # Verify the file is a valid zip
          unzip -t cotadirectory.zip || (echo "Invalid zip file downloaded" && exit 1)

      - name: Upload files to Vultr via SFTP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USERNAME }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          port: 22
          source: cotadirectory.zip
          target: /root/www/cotadirectory

      - name: Unpack and set permissions on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USERNAME }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          port: 22
          script: |
            cd /root/www/cotadirectory
            mkdir COTAdirectory-${{ steps.tag.outputs.tag }}
            unzip -o cotadirectory.zip -d COTAdirectory-${{ steps.tag.outputs.tag }}
            # Set permissions for all unzipped files and directories
            chown -R www-data:www-data COTAdirectory-${{ steps.tag.outputs.tag }}
            # Copy contents from cotadirectory-${{ steps.tag.outputs.tag }} to current directory
            cp -rf COTAdirectory-${{ steps.tag.outputs.tag }}/* .
            # Clean up unnecessary files
            # rm -rf COTAdirectory-${{ steps.tag.outputs.tag }}
            # rm cotadirectory.zip
